<title>Confidence Pool</title>
<style>
  :root{
    --turf-dark: #16261F; --turf: #1E3A2E; --turf-light: #274A38;
    --chalk: #F3EFE4; --chalk-dim: #C9C3B2; --gold: #D4A24E; --gold-dim: #8A7449;
    --line: #3A5548; --ed-accent: #6FA8DC; --kirk-accent: #D08A5C; --final-accent: #D4A24E;
    --bad: #C1512D; --good: #6FAE7A;
  --tier-low: #C1512D; --tier-lowmed: #D97B29; --tier-med: #D9C441; --tier-medhigh: #6FAE7A; --tier-high: #6FA8DC;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background: var(--turf-dark); color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 14px 12px 40px; max-width: 480px; margin: 0 auto; }
  h1,h2,h3{ margin: 0; }
  .kicker{ font-size: 13px; color: var(--gold); margin-bottom: 4px; letter-spacing: 0.02em; }
  .page-head{ padding: 6px 4px 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .page-head h1{ font-size: 24px; font-weight: 700; }
  .sub{ color: var(--chalk-dim); font-size: 13px; margin-top: 6px; line-height: 1.45; }
  .btn{ background: var(--turf-light); border: 1px solid var(--line); color: var(--chalk);
    font-size: 14px; font-weight: 600; padding: 11px 14px; border-radius: 8px; cursor: pointer; width: 100%; }
  .btn:active{ background: var(--gold-dim); }
  .btn.primary{ background: var(--gold); color: #2A2110; border-color: var(--gold); }
  .btn.ghost{ background: transparent; }
  .btn:disabled{ opacity: 0.5; }
  .btn-row{ display:flex; gap: 8px; }
  .btn-row > .btn{ flex: 1; }
  input[type="password"]{ width: 100%; background: var(--turf); border: 1px solid var(--line);
    color: var(--chalk); border-radius: 8px; padding: 11px 12px; font-size: 16px;
    letter-spacing: 0.15em; text-align: center; }
  .field-label{ font-size: 12.5px; color: var(--chalk-dim); margin: 14px 0 6px; }
  .error-text{ color: var(--bad); font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  .hint-text{ color: var(--chalk-dim); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .id-card{ background: var(--turf); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 18px; text-align: center; margin-top: 40px; }
  .id-choice-row{ display:flex; gap: 12px; margin-top: 18px; }
  .id-btn{ flex: 1; background: var(--turf-light); border: 2px solid var(--line); color: var(--chalk);
    border-radius: 10px; padding: 18px 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .id-btn.ed{ border-color: var(--ed-accent); }
  .id-btn.kirk{ border-color: var(--kirk-accent); }
  .topbar{ display:flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .whoami{ font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 6px; background: var(--turf-light); }
  .whoami.ed{ color: var(--ed-accent); }
  .whoami.kirk{ color: var(--kirk-accent); }
  .logout-link{ font-size: 12px; color: var(--chalk-dim); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .tabs{ display:flex; gap: 4px; margin-bottom: 16px; background: var(--turf); border-radius: 9px;
    padding: 3px; border: 1px solid var(--line); }
  .tab{ flex: 1; text-align: center; padding: 8px 4px; font-size: 12px; font-weight: 700;
    color: var(--chalk-dim); border-radius: 7px; cursor: pointer; background: transparent; border: none; }
  .tab.active{ background: var(--gold); color: #2A2110; }
  .game-card{ background: var(--turf); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .game-header{ display:flex; justify-content: space-between; align-items: center; padding: 10px 12px;
    background: var(--turf-light); border-bottom: 1px solid var(--line); }
  .matchup{ font-size: 15px; font-weight: 700; }
  .matchup .at{ color: var(--chalk-dim); font-weight: 400; margin: 0 3px; }
  .game-meta{ text-align: right; font-size: 11px; color: var(--chalk-dim); line-height: 1.4; }
  .spread{ color: var(--gold); font-weight: 600; }
  .picker-row{ display:flex; align-items:center; gap: 8px; padding: 10px 12px; }
  .team-toggle{ display:flex; flex: 1; background: var(--turf-dark); border-radius: 7px; padding: 2px; gap: 2px; }
  .team-btn{ flex: 1; background: transparent; border: none; color: var(--chalk-dim); font-size: 13px;
    font-weight: 600; padding: 8px 4px; border-radius: 5px; cursor: pointer; }
  .team-btn.active.ed{ background: var(--ed-accent); color: #0E1E2E; }
  .team-btn.active.kirk{ background: var(--kirk-accent); color: #2E1B0E; }
  .team-btn.active.final{ background: var(--final-accent); color: #2E230E; }
  select.pts{ width: 56px; flex-shrink: 0; background: var(--turf-dark); color: var(--chalk);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 2px; font-size: 14px; font-weight: 700;
    text-align: center; text-align-last: center; }
  .status-note{ padding: 8px 12px 12px; font-size: 12px; color: var(--chalk-dim); border-top: 1px solid var(--line);
    display:flex; justify-content: space-between; align-items: center; }
  .status-note .badge{ font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }

  .tier-row{ display:flex; gap: 5px; padding: 0 12px 10px; }
  .tier-btn{
    flex: 1; border: 1.5px solid var(--line); background: transparent;
    color: var(--chalk-dim); font-size: 10.5px; font-weight: 700;
    padding: 7px 2px; border-radius: 6px; cursor: pointer; text-align: center; line-height: 1.2;
  }
  .tier-btn.active{ color: #14201A; border-color: transparent; }
  .game-card.tier-low{ border-left: 4px solid var(--tier-low); }
  .game-card.tier-lowmed{ border-left: 4px solid var(--tier-lowmed); }
  .game-card.tier-med{ border-left: 4px solid var(--tier-med); }
  .game-card.tier-medhigh{ border-left: 4px solid var(--tier-medhigh); }
  .game-card.tier-high{ border-left: 4px solid var(--tier-high); }

  .tier-filter-row{ display:flex; gap: 5px; margin-bottom: 14px; }
  .tier-filter-btn{
    flex: 1; border: 1.5px solid var(--line); background: var(--turf);
    color: var(--chalk-dim); font-size: 10.5px; font-weight: 700;
    padding: 8px 2px; border-radius: 7px; cursor: pointer; text-align: center; line-height: 1.25;
  }
  .tier-filter-btn .cnt{ display:block; font-size: 13px; font-weight: 800; margin-top: 1px; }
  .tier-filter-btn.active{ color: #14201A; border-color: transparent; }
  .tier-filter-btn.all.active{ background: var(--chalk); }
  .badge.waiting{ background: var(--turf-light); color: var(--chalk-dim); }
  .badge.ready{ background: var(--good); color: #0E2410; }
  .compare-row{ display:flex; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13.5px; align-items:center; }
  .compare-row .clabel{ width: 44px; font-size: 11.5px; font-weight: 700; color: var(--chalk-dim); }
  .compare-row.ed .clabel{ color: var(--ed-accent); }
  .compare-row.kirk .clabel{ color: var(--kirk-accent); }
  .compare-pick{ flex: 1; font-weight: 700; }
  .compare-pts{ width: 30px; text-align:center; font-weight: 700; }
  .agree-tag{ font-size: 10.5px; padding: 2px 6px; border-radius: 10px; background: var(--turf-light); color: var(--chalk-dim); margin-left: 6px; }
  .agree-tag.diff{ background: var(--bad); color: #fff; }
  .compare-final-block{ border-top: 1.5px dashed var(--line); padding-top: 2px; margin-top: 2px; }
  .compare-final-label{ padding: 8px 12px 0; font-size: 11px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.03em; }

  .compare-cols{
    display: grid;
    grid-template-columns: 1fr 1fr 1.15fr;
    gap: 6px;
    padding: 10px 12px 4px;
  }
  .ccol{
    background: var(--turf-dark);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .ccol.final{ background: rgba(212,162,78,0.10); border: 1px solid var(--gold-dim); }
  .cc-label{ font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 5px; }
  .ccol.you .cc-label{ color: var(--ed-accent); }
  .ccol.kirk .cc-label{ color: var(--kirk-accent); }
  .ccol.final .cc-label{ color: var(--gold); }
  .cc-team{ font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .cc-pts{ font-size: 13px; font-weight: 700; color: var(--chalk-dim); }
  .cc-final-teams{ display:flex; gap: 3px; margin-bottom: 5px; }
  .cc-final-teams .team-btn{ font-size: 11px; padding: 6px 2px; }
  .ccol.final select.pts{ width: 100%; }
  .disagree-note{ text-align:center; font-size: 10.5px; color: var(--bad); padding: 0 12px 8px; font-weight: 600; }
  .build-footer{ text-align:center; font-size: 10px; color: var(--chalk-dim); opacity: 0.55; margin: 28px 0 6px; letter-spacing: 0.02em; }
  .reveal-btn{
    margin: 10px 12px 12px; width: calc(100% - 24px);
    background: var(--gold); color: #2A2110; border: none;
    font-size: 13px; font-weight: 700; padding: 9px; border-radius: 7px; cursor: pointer;

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);

}

Use standard NFL team abbreviations (e.g. BUF, KC, SF, NYG). "favorite" is "away" or "home" — whichever side DraftKings favors. If a DraftKings spread isn't posted yet for a game, set "favorite" and "spread" to null. Return ONLY the JSON array, nothing else.`;
  const result = await workerCall({ method: "CLAUDE_API", claudeMethod: "confResults", prompt });
  if(result.error) throw new Error(result.error);
  const clean = (result.text || "").replace(/```json|```/g, "").trim();
  const arr = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1));
  if(!Array.isArray(arr) || arr.length === 0) throw new Error("No games returned");
  const games = arr.map((g, i) => ({ id: "g" + (i + 1), ...g }));
  await saveScheduleToDB(weekId, games);
  state.scheduleCache[weekId] = games;
  return games;
}

function myPicksKey(){ return state.identity === "ed" ? "picksEd" : "picksKirk"; }
function usedPointsInMyColumn(excludeGameId){

  currentGames().forEach(g => { if(g.id !== excludeGameId && mine[g.id].pts != null) used.add(mine[g.id].pts); });

}
function usedPointsInFinal(excludeGameId){

async function setMyPick(gameId, team, pts){
  if(state.locked) return;
  const mine = state[myPicksKey()];
  const newPts = pts!==undefined ? pts : mine[gameId].pts;
  // If this point value is already used on a different game, clear it there (swap, not block).
  if(newPts != null){
    for(const g of currentGames()){
      if(g.id !== gameId && mine[g.id].pts === newPts){
        mine[g.id] = { ...mine[g.id], pts: null };
        await savePick(state.identity, g.id, mine[g.id].team, null, mine[g.id].tier);
      }
    }
  }
  const newVal = { team: team!==undefined?team:mine[gameId].team, pts: newPts, tier: mine[gameId].tier };
  mine[gameId] = newVal;
  render();
  await savePick(state.identity, gameId, newVal.team, newVal.pts, newVal.tier);
}
async function setMyTier(gameId, tier){
  if(state.locked) return;
  const mine = state[myPicksKey()];
  const cur = mine[gameId];
  const newTier = cur.tier === tier ? null : tier; // tap again to clear
  mine[gameId] = { team: cur.team, pts: cur.pts, tier: newTier };
  render();
  await savePick(state.identity, gameId, cur.team, cur.pts, newTier);
}
async function setFinalPick(gameId, team, pts){
  if(state.locked) return;
  const newPts = pts!==undefined ? pts : state.final[gameId].pts;
  if(newPts != null){
    for(const g of currentGames()){
      if(g.id !== gameId && state.final[g.id].pts === newPts){
        state.final[g.id] = { ...state.final[g.id], pts: null };
        await saveFinal(g.id, state.final[g.id].team, null);
      }
    }
  }
  const newVal = { team: team!==undefined?team:state.final[gameId].team, pts: newPts };
  state.final[gameId] = newVal;
  render();
  await saveFinal(gameId, newVal.team, newVal.pts);
}
function isComplete(p){ return p && p.team && p.pts != null; }
function bothSubmitted(gameId){ return isComplete(state.picksEd[gameId]) && isComplete(state.picksKirk[gameId]); }

function lockedBannerHTML(){

}
// Builds <option> list for a points <select>: never disables an already-used value
// (picking it will swap it off whichever game currently holds it), just shades it.
function ptsOptionsHTML(n, currentPts, usedSet){
  let options = `<option value="" ${currentPts==null?"selected":""}></option>`;
  for(let i=1;i<=n;i++){
    const isUsedElsewhere = usedSet.has(i) && currentPts !== i;
    const style = isUsedElsewhere ? ' style="background:var(--turf-light);color:var(--gold-dim);"' : "";
    options += `<option value="${i}" ${currentPts===i?"selected":""}${style}>${i}${isUsedElsewhere?" •":""}</option>`;
  }
  return options;
}

function validateFinalForLock(){
  const games = currentGames();
  const n = games.length;
  const missingWinner = [];
  const missingPts = [];
  const ptsUsed = new Set();
  const dupPts = [];
  games.forEach(g => {
    const f = state.final[g.id];
    if(!f.team) missingWinner.push(g.id);
    if(f.pts == null) missingPts.push(g.id);
    else {
      if(ptsUsed.has(f.pts)) dupPts.push(f.pts);
      ptsUsed.add(f.pts);
    }
  });
  const errors = [];
  if(missingWinner.length) errors.push(`${missingWinner.length} game(s) still need a Final winner chosen.`);
  if(missingPts.length) errors.push(`${missingPts.length} game(s) still need Final points assigned.`);
  if(dupPts.length) errors.push(`Points are duplicated (shouldn't be possible, but flagging): ${[...new Set(dupPts)].join(", ")}.`);
  if(!missingPts.length && !dupPts.length && ptsUsed.size !== n) errors.push(`Points must cover 1 through ${n} exactly, with no gaps.`);
  return errors;
}

async function attemptLockWeek(){
  const errors = validateFinalForLock();
  if(errors.length){
    showToast(errors[0]);
    render();
    return;
  }
  const ok = await lockWeek();
  if(ok){
    state.locked = true;
    showToast("Week locked — picks are now final.");
  } else {
    showToast("Couldn't lock right now — check connection and try again.");
  }
  render();
}

async function checkResults(){
  const btn = document.getElementById("checkResultsBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Checking…"; }
  try{
    const wk = WEEKS[state.week];
    const gameList = wk.games.map(g => `${g.id}: ${g.awayAb} (away) at ${g.homeAb} (home)`).join("\n");
    const prompt = `Search the web for NFL ${wk.label} 2026 scores (games scheduled ${wk.dateRange}). Some of these games may not have kicked off yet, may be in progress, or may not have final scores available yet — that's expected and fine. For each game below, check whether it has an official FINAL score. Respond with ONLY a JSON object, no other text, no markdown fences: include a key for every game that has a confirmed final score (mapping to an object with "winner" as "away" or "home", and "score" as "awayScore-homeScore"), and simply OMIT the key entirely for any game that hasn't finished yet, is in progress, or you can't confirm. Do not guess or include an entry unless you're confident the game is actually over. Example: {"g1": {"winner":"home","score":"10-13"}}.

Games:
${gameList}`;
    const result = await workerCall({ method: "CLAUDE_API", claudeMethod: "confResults", prompt });
    if(result.error) throw new Error(result.error);
    const clean = (result.text || "").replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    const foundCount = Object.keys(parsed).length;
    if(foundCount > 0) await saveResults(parsed);
    state.results = await getResults(); // reload the full merged set from the DB, not just this response
    const totalGames = currentGames().length;
    if(foundCount === 0) showToast("No final scores found yet — check back once games wrap up.");
    else if(foundCount < totalGames) showToast(`${foundCount} of ${totalGames} games final so far — updated.`);
    else showToast("All games final — results updated.");
  }catch(e){
    showToast("Couldn't fetch results automatically. Try again shortly.");
    console.error(e);
  }
  render();
}

function pointsEarned(picksObj, gameId){
  if(!state.results || !state.results[gameId]) return null;
  const p = picksObj[gameId];
  if(!isComplete(p)) return 0;
  return p.team === state.results[gameId].winner ? p.pts : 0;
}
function weekTotal(picksObj){
  if(!state.results) return null;
  let total = 0;
  currentGames().forEach(g => { const pe = pointsEarned(picksObj, g.id); if(pe != null) total += pe; });
  return total;
}

// State-independent scoring, used by the season summary so it can score every
// week without disturbing whichever week is currently on screen.
function calcTotalFor(picksMap, resultsMap){
  let total = 0, correct = 0, scored = 0;
  Object.keys(resultsMap).forEach(gameId => {
    const r = resultsMap[gameId];
    const p = picksMap[gameId];
    if(!p || !p.team || p.pts == null) return;
    scored++;
    if(p.team === r.winner){ total += p.pts; correct++; }
  });
  return { total, correct, scored };
}

async function getWeekSummary(weekId){
  try{
    const [edRows, kirkRows, finalRows, resultRows] = await Promise.all([
      sbGet('ConfPicks', `week=eq.${weekId}&identity=eq.ed`),
      sbGet('ConfPicks', `week=eq.${weekId}&identity=eq.kirk`),
      sbGet('ConfFinal', `week=eq.${weekId}`),
      sbGet('ConfResults', `week=eq.${weekId}`),
    ]);
    if(!resultRows || resultRows.length === 0) return null; // not scored yet — skip from season view
    const resultsMap = {}; resultRows.forEach(r => resultsMap[r.game_id] = {winner:r.winner, score:r.score});
    const toMap = (rows) => { const m = {}; (rows||[]).forEach(r => m[r.game_id] = {team:r.team, pts:r.pts}); return m; };
    return {
      week: weekId,
      label: WEEKS[weekId].label,
      ed: calcTotalFor(toMap(edRows), resultsMap),
      kirk: calcTotalFor(toMap(kirkRows), resultsMap),
      final: calcTotalFor(toMap(finalRows), resultsMap),
    };
  }catch(e){ return null; }
}

async function loadSeasonSummary(){
  const rows = [];
  for(const wk of WEEK_ORDER){
    const s = await getWeekSummary(wk);
    if(s) rows.push(s);
  }
  return rows;
}

      card.querySelector("select").onchange = (e) => setMyPick(g.id, undefined, e.target.value === "" ? null : parseInt(e.target.value,10));
      if(state.identity === "ed"){
        card.querySelectorAll('[data-tier]').forEach(btn => {
          btn.onclick = () => setMyTier(g.id, btn.dataset.tier);
        });
      }
    }
    myGames.appendChild(card);
  });
}

function renderCompare(container){
  const games = currentGames(); const n = currentN();
  let readyCount = 0; games.forEach(g => { if(bothSubmitted(g.id)) readyCount++; });
  const errors = validateFinalForLock();

  container.innerHTML = `
    ${lockedBannerHTML()}
    <div class="status-bar"><div class="status-pill final"><span class="n">${readyCount}/${n}</span>Ready to compare</div></div>
    ${readyCount > 0 ? `<button type="button" class="btn ghost" id="compareAllBtn" style="margin-bottom:14px;">Compare All (${readyCount} ready)</button>` : ""}
    <div id="compareGames"></div>
    <div id="lockArea"></div>
  `;
  const compareAllBtn = document.getElementById("compareAllBtn");
  if(compareAllBtn){
    compareAllBtn.onclick = () => {
      games.forEach(g => { if(bothSubmitted(g.id)) state.revealed[g.id] = true; });
      render();
    };
  }
  const holder = document.getElementById("compareGames");
  games.forEach(g => {
    const ready = bothSubmitted(g.id); const favTeam = g.favorite === "home" ? g.homeAb : g.awayAb;
    const revealed = !!state.revealed[g.id];
    const card = document.createElement("div"); card.className = "game-card";
    let body;
    if(!ready){
      body = `<div class="status-note"><span>Waiting on both picks before this can be compared.</span></div>`;
    } else if(!revealed){
      body = `<button type="button" class="reveal-btn" data-reveal="${g.id}">Compare picks</button>`;
    } else {
      const ed = state.picksEd[g.id], kirk = state.picksKirk[g.id];
      const edTeamAb = ed.team === "away" ? g.awayAb : g.homeAb;
      const kirkTeamAb = kirk.team === "away" ? g.awayAb : g.homeAb;
      const agree = ed.team === kirk.team;
      // Auto-fill Final's team when they agree and Final hasn't been set yet (never overwrite a manual choice).
      if(agree && !state.final[g.id].team && !state.locked){
        state.final[g.id] = { ...state.final[g.id], team: ed.team };
        saveFinal(g.id, ed.team, state.final[g.id].pts);
      }
      const f = state.final[g.id];
      const usedFinal = usedPointsInFinal(g.id);
      const finalOptions = ptsOptionsHTML(n, f.pts, usedFinal);
      body = `
        <div class="compare-cols">
          <div class="ccol you">
            <div class="cc-label">You</div>
            <div class="cc-team">${edTeamAb}</div>
            <div class="cc-pts">${ed.pts}</div>
          </div>
          <div class="ccol kirk">
            <div class="cc-label">Kirk</div>
            <div class="cc-team">${kirkTeamAb}</div>
            <div class="cc-pts">${kirk.pts}</div>
          </div>
          <div class="ccol final">
            <div class="cc-label">Final</div>
            <div class="cc-final-teams">
              <button type="button" class="team-btn ${f.team==='away'?'active final':''}" data-fteam="away" ${state.locked?"disabled":""}>${g.awayAb}</button>
              <button type="button" class="team-btn ${f.team==='home'?'active final':''}" data-fteam="home" ${state.locked?"disabled":""}>${g.homeAb}</button>
            </div>
            <select class="pts" data-fpts ${state.locked?"disabled":""}>${finalOptions}</select>
          </div>
        </div>
        ${!agree ? `<div class="disagree-note">You differ on the winner — choose Final above.</div>` : ""}
        ${!state.locked ? `<button type="button" class="hide-link" data-hide="${g.id}">hide</button>` : ""}
      `;
    }
    card.innerHTML = `<div class="game-header"><div class="matchup">${g.awayAb}<span class="at">@</span>${g.homeAb}</div>
      <div class="game-meta">${g.when}<br><span class="spread">${favTeam} -${g.spread}</span></div></div>${body}`;

    const revealBtn = card.querySelector('[data-reveal]');
    if(revealBtn) revealBtn.onclick = () => { state.revealed[g.id] = true; render(); };
    const hideBtn = card.querySelector('[data-hide]');
    if(hideBtn) hideBtn.onclick = () => { state.revealed[g.id] = false; render(); };
    if(revealed && ready && !state.locked){
      const fAway = card.querySelector('[data-fteam="away"]');
      const fHome = card.querySelector('[data-fteam="home"]');
      if(fAway) fAway.onclick = () => setFinalPick(g.id, "away", undefined);
      if(fHome) fHome.onclick = () => setFinalPick(g.id, "home", undefined);
      const fSel = card.querySelector('[data-fpts]');
      if(fSel) fSel.onchange = (e) => setFinalPick(g.id, undefined, e.target.value === "" ? null : parseInt(e.target.value,10));
    }
    holder.appendChild(card);
  });

  const lockArea = document.getElementById("lockArea");
  if(state.locked){
    lockArea.innerHTML = `<div class="hint-text" style="text-align:center;margin-top:12px;">🔒 This week is locked. Final picks are official.</div>`;
  } else {
    lockArea.innerHTML = `
      ${errors.length ? `<div class="lock-summary"><strong>Not ready to lock yet:</strong><ul>${errors.map(e=>`<li>${e}</li>`).join("")}</ul></div>` : ""}
      <button class="btn primary" id="lockBtn" style="margin-top:14px;">Lock Picks for ${WEEKS[state.week].label}</button>
      <div class="hint-text" style="text-align:center;">This locks everyone's picks and the Final column for good — only do this once you're both ready.</div>
    `;
    document.getElementById("lockBtn").onclick = async () => {
      if(!confirm(`Lock ${WEEKS[state.week].label}? Neither of you will be able to change picks after this.`)) return;
      await attemptLockWeek();
    };
  }
}

function renderFinal(container){
  const games = currentGames(); const n = currentN();
  let doneCount = 0; games.forEach(g => { if(isComplete(state.final[g.id])) doneCount++; });
  container.innerHTML = `
    ${lockedBannerHTML()}
    <div class="status-bar"><div class="status-pill final"><span class="n">${doneCount}/${n}</span>Final set</div></div>
    <div class="hint-text" style="margin-bottom:12px;">Open to both of you — no PIN. This is easiest to fill out via the Compare tab's Final column, but you can also set it directly here.</div>
    <div id="finalGames"></div>`;
  const holder = document.getElementById("finalGames");
  games.forEach(g => {
    const p = state.final[g.id]; const used = usedPointsInFinal(g.id);
    const favTeam = g.favorite === "home" ? g.homeAb : g.awayAb;
    const options = ptsOptionsHTML(n, p.pts, used);
    const card = document.createElement("div"); card.className = "game-card";
    card.innerHTML = `
      <div class="game-header"><div class="matchup">${g.awayAb}<span class="at">@</span>${g.homeAb}</div>
        <div class="game-meta">${g.when}<br><span class="spread">${favTeam} -${g.spread}</span></div></div>
      <div class="picker-row">
        <div class="team-toggle">
          <button type="button" class="team-btn ${p.team==='away'?'active final':''}" data-team="away" ${state.locked?"disabled":""}>${g.awayAb}</button>
          <button type="button" class="team-btn ${p.team==='home'?'active final':''}" data-team="home" ${state.locked?"disabled":""}>${g.homeAb}</button>
        </div>
        <select class="pts" ${state.locked?"disabled":""}>${options}</select>
      </div>`;
    if(!state.locked){
      card.querySelector('[data-team="away"]').onclick = () => setFinalPick(g.id, "away", undefined);
      card.querySelector('[data-team="home"]').onclick = () => setFinalPick(g.id, "home", undefined);
      card.querySelector("select").onchange = (e) => setFinalPick(g.id, undefined, e.target.value === "" ? null : parseInt(e.target.value,10));
    }
    holder.appendChild(card);
  });
}

function renderResults(container){
  container.innerHTML = `
    <div class="tabs" style="margin-bottom:14px;">
      <button class="tab ${state.resultsView==='week'?'active':''}" data-rview="week">This Week</button>
      <button class="tab ${state.resultsView==='season'?'active':''}" data-rview="season">Season</button>
    </div>
    <div id="resultsBody"></div>
  `;
  container.querySelectorAll('[data-rview]').forEach(btn => {
    btn.onclick = async () => {
      state.resultsView = btn.dataset.rview;
      if(state.resultsView === "season" && !state.seasonData && !state.seasonLoading){
        state.seasonLoading = true;
        render();
        state.seasonData = await loadSeasonSummary();
        state.seasonLoading = false;
      }
      render();
    };
  });
  const body = document.getElementById("resultsBody");
  if(state.resultsView === "week") renderResultsWeek(body);
  else renderResultsSeason(body);
}

function renderResultsWeek(container){
  const games = currentGames();
  const edTotal = weekTotal(state.picksEd), kirkTotal = weekTotal(state.picksKirk), finalTotal = weekTotal(state.final);
  container.innerHTML = `
    <div class="hint-text" style="margin-bottom:10px;">Showing ${WEEKS[state.week].label}.</div>
    <button class="btn primary" id="checkResultsBtn" style="margin-bottom:16px;">${state.results ? "Re-check results" : "Check results"}</button>
    ${state.results ? `
      <div class="status-bar">
        <div class="status-pill ed"><span class="n">${edTotal}</span>Ed</div>
        <div class="status-pill kirk"><span class="n">${kirkTotal}</span>Kirk</div>
        <div class="status-pill final"><span class="n">${finalTotal}</span>Final</div>
      </div>
      <div class="section-title">Game by game</div>
      <table class="tally-table">
        <tr><th>Game</th><th>Winner</th><th>Ed</th><th>Kirk</th><th>Final</th></tr>
        ${games.map(g => {
          const r = state.results[g.id];
          const winAb = r ? (r.winner === "away" ? g.awayAb : g.homeAb) : "—";
          const edP = pointsEarned(state.picksEd, g.id), kirkP = pointsEarned(state.picksKirk, g.id), finalP = pointsEarned(state.final, g.id);
          return `<tr><td>${g.awayAb}@${g.homeAb}</td><td>${winAb}${r&&r.score?` (${r.score})`:""}</td>
            <td class="${edP>0?'win':'lose'}">${edP!=null?edP:"—"}</td>
            <td class="${kirkP>0?'win':'lose'}">${kirkP!=null?kirkP:"—"}</td>
            <td class="${finalP>0?'win':'lose'}">${finalP!=null?finalP:"—"}</td></tr>`;
        }).join("")}
      </table>
    ` : `<div class="hint-text">No results yet — tap "Check results" once this week's games are finished.</div>`}
  `;
  document.getElementById("checkResultsBtn").onclick = checkResults;
}

function renderResultsSeason(container){
  if(state.seasonLoading){
    container.innerHTML = `<div class="loading">Loading season totals…</div>`;
    return;
  }
  const data = state.seasonData || [];
  if(!data.length){
    container.innerHTML = `<div class="hint-text">No scored weeks yet — check results on at least one week first.</div>
      <button class="btn ghost" id="refreshSeasonBtn" style="margin-top:12px;">Refresh</button>`;
    document.getElementById("refreshSeasonBtn").onclick = async () => {
      state.seasonLoading = true; render();
      state.seasonData = await loadSeasonSummary();
      state.seasonLoading = false; render();
    };
    return;
  }

  const { col, dir } = state.seasonSort;
  const sorted = [...data].sort((a,b) => {
    let av, bv;
    if(col === "week") { av = WEEK_ORDER.indexOf(a.week); bv = WEEK_ORDER.indexOf(b.week); }
    else { av = a[col].total; bv = b[col].total; }
    return dir === "asc" ? av - bv : bv - av;
  });

  const grand = { ed:0, kirk:0, final:0 };
  data.forEach(r => { grand.ed += r.ed.total; grand.kirk += r.kirk.total; grand.final += r.final.total; });

  const arrow = (c) => col === c ? (dir === "asc" ? " ▲" : " ▼") : "";

  container.innerHTML = `
    <div class="status-bar">
      <div class="status-pill ed"><span class="n">${grand.ed}</span>Ed — Season</div>
      <div class="status-pill kirk"><span class="n">${grand.kirk}</span>Kirk — Season</div>
      <div class="status-pill final"><span class="n">${grand.final}</span>Final — Season</div>
    </div>
    <div class="section-title">By week — tap a header to sort</div>
    <table class="tally-table">
      <tr>
        <th data-sort="week" style="cursor:pointer;">Week${arrow("week")}</th>
        <th data-sort="ed" style="cursor:pointer;">Ed${arrow("ed")}</th>
        <th data-sort="kirk" style="cursor:pointer;">Kirk${arrow("kirk")}</th>
        <th data-sort="final" style="cursor:pointer;">Final${arrow("final")}</th>
      </tr>
      ${sorted.map(r => `
        <tr>
          <td>${r.label}</td>
          <td>${r.ed.total} <span style="color:var(--chalk-dim);font-size:10.5px;">(${r.ed.correct}/${r.ed.scored})</span></td>
          <td>${r.kirk.total} <span style="color:var(--chalk-dim);font-size:10.5px;">(${r.kirk.correct}/${r.kirk.scored})</span></td>
          <td>${r.final.total} <span style="color:var(--chalk-dim);font-size:10.5px;">(${r.final.correct}/${r.final.scored})</span></td>
        </tr>
      `).join("")}
      <tr style="font-weight:800;background:var(--turf-light);">
        <td>Season Total</td><td>${grand.ed}</td><td>${grand.kirk}</td><td>${grand.final}</td>
      </tr>
    </table>
    <button class="btn ghost" id="refreshSeasonBtn" style="margin-top:14px;">Refresh season totals</button>
  `;
  container.querySelectorAll('[data-sort]').forEach(th => {
    th.onclick = () => {
      const c = th.dataset.sort;
      if(state.seasonSort.col === c) state.seasonSort.dir = state.seasonSort.dir === "asc" ? "desc" : "asc";
      else state.seasonSort = { col: c, dir: "asc" };
      render();
    };
  });
  document.getElementById("refreshSeasonBtn").onclick = async () => {
    state.seasonLoading = true; render();
    state.seasonData = await loadSeasonSummary();
    state.seasonLoading = false; render();
  };
}

(async function init(){ render(); })();
</script>
</body>
</html>
